apply from: "${project.rootDir}/dependConfig.gradle"
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

// android 通用配置
android {
    compileSdkVersion COMPILE_SDK.toInteger()

    defaultConfig {
        minSdkVersion MIN_SDK.toInteger()
        targetSdkVersion TARGET_SDK.toInteger()
        versionCode ICE_CREAM_VERSION_CODE.toInteger()
        versionName ICE_CREAM_VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true  // 为这个 module 生成 BuildConfig 类(引用了generalConfig的模块都会生成，app模块会默认生成，Library Module默认不生成)
        viewBinding true
        dataBinding true
    }

    buildTypes {
        release {
            minifyEnabled false   // 是否开启代码压缩 / 混淆 / 优化（R8）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'  // 指定 R8 使用的混淆规则文件
        }
        debug {

        }
    }

    lint {

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

}
// 通用依赖
dependencies {
    testImplementation "${officialDependence.junit}"
    androidTestImplementation "${officialDependence.testJunit}"
    androidTestImplementation "${officialDependence.espresso}"
}

